[package]
name = "ferrite-studio"
version = "0.1.0"
edition = "2021"
description = "Browser-based neural network studio powered by ferrite-nn."

[[bin]]
name = "studio"
path = "src/main.rs"

[dependencies]
ferrite-nn   = { path = "../ferrite-nn" }
axum         = { version = "0.7", features = ["multipart"] }
tokio        = { version = "1", features = ["full"] }
tower-http   = { version = "0.5", features = ["cors", "fs"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
image        = { version = "0.24", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }
futures      = "0.3"
